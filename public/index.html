<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Request a service</title>
  <meta name="description" content="Tell us about the job and we'll get back to you.">
  <meta name="theme-color" content="#1f2a86">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/app.css">
</head>
<body class="carbon">
  <nav class="intake-bar" aria-label="Account">
    <a class="header-button" href="/login">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/></svg>
      Owner sign in
    </a>
  </nav>
  <main class="intake">
    <header class="intake-intro">
      <h1>What needs doing?</h1>
      <p>Tell us about the job. We read every request and reply by phone or email.</p>
    </header>

    <section class="ticket perforated" aria-label="Service request">
      <form id="lead-form" novalidate>
        <p class="form-note">All fields are required unless marked optional.</p>

        <div class="field">
          <label for="name">Your name</label>
          <input id="name" name="name" type="text" autocomplete="name" autocapitalize="words" enterkeyhint="next" required aria-describedby="name-error">
          <p class="field-error" id="name-error" hidden></p>
        </div>

        <div class="field-pair">
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" enterkeyhint="next" required aria-describedby="email-error">
            <p class="field-error" id="email-error" hidden></p>
          </div>
          <div class="field">
            <label for="phone">Phone <span class="optional">(optional)</span></label>
            <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" enterkeyhint="next" aria-describedby="phone-error">
            <p class="field-error" id="phone-error" hidden></p>
          </div>
        </div>

        <fieldset class="field" aria-describedby="service-error">
          <legend>Type of service</legend>
          <div class="service-options">
            <label class="service-option"><input type="radio" name="service" value="cleaning" required><span>Cleaning</span></label>
            <label class="service-option"><input type="radio" name="service" value="repair"><span>Repair</span></label>
            <label class="service-option"><input type="radio" name="service" value="consultation"><span>Consultation</span></label>
            <label class="service-option"><input type="radio" name="service" value="other"><span>Other</span></label>
          </div>
          <p class="field-error" id="service-error" hidden></p>
        </fieldset>

        <div class="field">
          <label for="message">About the job</label>
          <textarea id="message" name="message" rows="5" required aria-describedby="message-error message-count" placeholder="What's the problem, where is it, and when would suit you?"></textarea>
          <p class="field-hint" id="message-count">0 of 2000 characters</p>
          <p class="field-error" id="message-error" hidden></p>
        </div>

        <p class="form-alert" id="form-alert" role="alert" hidden></p>
        <button class="primary" id="submit" type="submit">Send request</button>
      </form>

      <div id="receipt" class="receipt" tabindex="-1" hidden>
        <p class="stamp stamp-won stamp-press">Received</p>
        <h2 id="receipt-title"></h2>
        <p id="receipt-detail"></p>
        <button class="secondary" id="another" type="button">Send another request</button>
      </div>
    </section>
  </main>
  <script type="module" src="/form.js"></script>
</body>
</html>
